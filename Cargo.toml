[package]
name = "dismus"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rwxae/dismus"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
lofty = "0.25.1"
musicbrainz_rs = { version = "0.14.0", features = ["async", "rustls", "rate_limit"] }
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
